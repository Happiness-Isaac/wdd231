<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Queue | FilmQuee</title>
    <meta name="description"
        content="See the movies you saved to your FilmQuee queue and suggest new titles to add.">
    <meta name="author" content="Happiness Isaac">

    <meta property="og:title" content=">My Queue | FilmQuee">
    <meta property="og:description"
        content="See the movies you saved to your FilmQuee queue and suggest new titles to add.">
    <meta property="og:url" content="">
    <meta property="og:image" content="">

    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/final.css">
    <script type="module" src="scripts/queue.js"></script>
</head>

<body>
    <header class="site-header">
        <img src="images/logo.webp" alt="FilmQuee Logo" width="300" height="200">
        <span>FilmQuee</span>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"
            aria-label="Toggle
                navigation menu">&#9776;</button>
        <nav aria-label="Main">
            <ul id="primary-nav" class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html">Browse</a></li>
                <li><a href="queue.html" aria-current="page">My Queue</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>My Queue</h1>
        <p id="queue-summary" class="meta" aria-live="polite"></p>
        <div id="queue-grid" class="grid"></div>
    
        <section id="suggest" class="suggest" aria-labelledby="suggest-heading">
            <h2 id="suggest-heading">Suggest a movie</h2>
            <p>Missing a favorite? Tell us what to add.</p>
            <form action="thanks.html" method="get">
                <label for="title">Movie title (required)</label>
                <input id="title" name="title" type="text" required>
    
                <label for="sg-genre">Genre</label>
                <select id="sg-genre" name="genre" required>
                    <option value="">Choose a genre</option>
                    <option>Action</option>
                    <option>Animation</option>
                    <option>Comedy</option>
                    <option>Drama</option>
                    <option>Horror</option>
                    <option>Romance</option>
                    <option>Sci-Fi</option>
                    <option>Thriller</option>
                </select>
    
                <label for="year-input">Release year</label>
                <input id="year-input" name="year" type="number" min="1900" max="2030" inputmode="numeric">
    
                <label for="email">Email (required)</label>
                <input id="email" name="email" type="email" required autocomplete="email">
    
                <label for="comments">Why should we add it?</label>
                <textarea id="comments" name="comments" rows="4"></textarea>
    
                <button class="btn" type="submit">Send suggestion</button>
            </form>
        </section>
    </main>

    <dialog id="movie-dialog" aria-labelledby="dialog-title">
        <button type="button" class="dialog-close" aria-label="Close movie details">&times;</button>
        <div class="dialog-content"></div>
    </dialog>
    
    <footer class="site-footer">
        <p>&copy; <span id="year">2026</span> FilmQuee. Built by Happiness Isaac for WDD231 Final Project.</p>
        <p><a href="attributions.html">Attributions</a> | <a href="YOUR_VIDEO_URL">JavaScript Demo Video</a></p>
    </footer>
</body>
</html>
