<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Movies | FilmQuee</title>
    <meta name="description"
        content="Filter 20 Movies by genre and rating, view details and trailers, add favories to your queue.">
    <meta name="author" content="Happiness Isaac">

    <meta property="og:title" content="Browse Movies | FilmQuee">
    <meta property="og:description"
        content="Filter 20 Movies by genre and rating, view details and trailers, add favories to your queue.">
    <meta property="og:url" content="">
    <meta property="og:image" content="">

    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&amp;display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/final.css">
    <script type="module" src="scripts/browse.js"></script>
</head>
<body>
    <header class="site-header">
        <img src="images/logo.webp" alt="FilmQuee Logo" width="300" height="200">
        <span>FilmQuee</span>
        <button id="menu-toggle" class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav"
            aria-label="Toggle
            navigation menu">&#9776;</button>
        <nav aria-label="Main">
            <ul id="primary-nav" class="nav-list">
                <li><a href="index.html">Home</a></li>
                <li><a href="browse.html" aria-current="page">Browse</a></li>
                <li><a href="queue.html">My Queue</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Browse movies</h1>
        <form class="filters" aria-label="Filter movies" onsubmit="return false">
            <div>
                <label for="genre">Genre</label>
                <select id="genre">
                    <option value="all">All genres</option>
                </select>
            </div>
            <div>
                <label for="min-rating">Minimum rating</label>
                <select id="min-rating">
                    <option value="0">Any rating</option>
                    <option value="7.5">7.5 and up</option>
                    <option value="8">8.0 and up</option>
                    <option value="8.5">8.5 and up</option>
                </select>
            </div>
            <div>
                <label for="sort">Sort by</label>
                <select id="sort">
                    <option value="rating">Highest rated</option>
                    <option value="title">Title A to Z</option>
                </select>
            </div>
        </form>
        <p id="result-count" class="meta" aria-live="polite"></p>
        <div id="movie-grid" class="grid"></div>

    </main>

    <dialog id="movie-dialog" aria-labelledby="dialog-title">
        <button type="button" class="dialog-close" aria-label="Close movie details">&times;</button>
        <div class="dialog-content"></div>
    </dialog>
    
    <footer class="site-footer">
        <p>&copy; <span id="year">2026</span> FilmQuee. Built by Happiness Isaac for WDD231 Final Project.</p>
        <p><a href="attributions.html">Attributions</a> | <a href="YOUR_VIDEO_URL">JavaScript Demo Video</a></p>
    </footer>
</body>
</html>
